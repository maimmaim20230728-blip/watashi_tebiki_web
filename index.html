<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2e9e6b">
<title>場面の手引き・そよぎ</title>
<meta name="description" content="暗黙の言い方の辞典・場面ごとの自分用の台本・失敗と次に試すこと・いま電話のメモ。端末内のみ・オフライン・登録なし。">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body class="fs0">
<header id="hd">
  <div id="hd-title">場面の手引き・そよぎ</div>
  <div id="hd-right">
    <div id="lang-wrap">
      <span class="lang-label">Language</span>
      <select id="set-lang" aria-label="Language 言語">
        <option value="ja">日本語</option>
        <option value="en">English</option>
        <option value="de">Deutsch</option>
        <option value="fr">Français</option>
        <option value="es">Español</option>
        <option value="it">Italiano</option>
        <option value="pt">Português</option>
        <option value="nl">Nederlands</option>
        <option value="sv">Svenska</option>
        <option value="ko">한국어</option>
        <option value="zh">简体中文</option>
        <option value="ar">العربية</option>
      </select>
    </div>
  </div>
</header>

<main id="main">

  <!-- ホーム(screens/home.js が描く) -->
  <section id="scr-home" class="screen" data-scr="home"></section>

  <!-- ばめんを えらぶ(入口) → じてん / だいほん / 言う前の てんけん(ナビには置かず、ばめん画面から行く) -->
  <section id="scr-bamen" class="screen hidden" data-scr="bamen"></section>
  <section id="scr-dict" class="screen hidden" data-scr="dict"></section>
  <section id="scr-script" class="screen hidden" data-scr="script"></section>
  <section id="scr-precheck" class="screen hidden" data-scr="precheck"></section>
  <!-- あとで 書く(失敗と つぎ) / いま電話 -->
  <section id="scr-after" class="screen hidden" data-scr="after"></section>
  <section id="scr-call" class="screen hidden" data-scr="call"></section>

  <!-- せってい(共通シェル。文言は app.js の I18N_MAP が入れる) -->
  <section id="scr-set" class="screen hidden" data-scr="set">
    <h2 id="set-h-normal" class="sec-h"></h2>
    <div class="set-row"><span id="lbl-fs"></span><button id="btn-fs" class="set-btn"></button></div>
    <div class="set-row"><span id="lbl-theme"></span><button id="btn-theme" class="set-btn"></button></div>
    <div class="set-row"><span id="lbl-bgm"></span><button id="btn-bgm" class="set-btn"></button></div>
    <div class="set-row"><span id="lbl-sound"></span><button id="btn-sound" class="set-btn"></button></div>

    <!-- BUILDER: アプリ固有の設定行はここに足す(id は set-app-* で) -->
    <div id="set-app-rows"></div>

    <h2 id="set-h-backup" class="sec-h"></h2>
    <p id="bk-hint" class="hint"></p>
    <div class="bk-row">
      <button id="bk-export" class="set-btn"></button>
      <button id="bk-import" class="set-btn"></button>
    </div>
    <input id="bk-file" type="file" accept="application/json,.json" class="hidden">

    <p id="set-note" class="hint"></p>
    <p class="credit"><a id="link-privacy" href="privacy.html"></a></p>
    <p class="credit"><a id="about-credit" href="https://soudansoyogi.com/" target="_blank" rel="noopener"></a></p>
    <p id="about-ver" class="credit"></p>
  </section>

</main>

<nav id="navbar">
  <button id="nav-home" class="nav-btn active" data-scr="home"></button>
  <button id="nav-bamen" class="nav-btn" data-scr="bamen"></button>
  <button id="nav-after" class="nav-btn" data-scr="after"></button>
  <button id="nav-call" class="nav-btn" data-scr="call"></button>
  <button id="nav-set" class="nav-btn" data-scr="set"></button>
</nav>

<div id="toast" class="toast"></div>

<script src="audio.js"></script>
<script src="tap.js"></script>
<script src="i18n.js"></script>
<script src="photo.js"></script>
<script src="data/dict.ja.js"></script>
<script src="screens/router.js"></script>
<script src="screens/parts.js"></script>
<script src="screens/home.js"></script>
<script src="screens/bamen.js"></script>
<script src="screens/dict.js"></script>
<script src="screens/script.js"></script>
<script src="screens/precheck.js"></script>
<script src="screens/after.js"></script>
<script src="screens/call.js"></script>
<script src="app.js"></script>
</body>
</html>
